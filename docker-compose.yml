# Local Neo4j for Emori's memory graph. Development only.
#   docker compose up -d
#   Browser: http://localhost:7474   Bolt: bolt://localhost:7687
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: emori-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-emori-local-dev}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - emori-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD:-emori-local-dev}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  emori-neo4j-data:
